    <div class="content">
        <img class="game-icon"
            src="https://www.justkaarlo.com/res/src/header-cards/card-guides.png"
            alt="guides"/>
        
        <div class="guides-container">
            <div class="guides-grid">
                <!-- Getting Started Guide -->
                <button class="guide-button" onclick="openGuide('Getting Started', 'https://placehold.co/1200x800/2a2a2a/ffaa00?text=Getting+Started+Guide')">
                    <img class="guide-icon" src="https://cdn-icons-png.flaticon.com/512/1828/1828833.png" alt="">

                        <span class="guide-title">Getting Started</span>
                        <span class="guide-subtitle">Basic gameplay introduction</span>

                    </div>
                </button>

                <!-- Seasonal Guide -->
                <button class="guide-button" onclick="openGuide('Seasonal Guide', 'https://placehold.co/1200x800/2a2a2a/ffaa00?text=Seasonal+Guide')">
                    <img class="guide-icon" src="https://cdn-icons-png.flaticon.com/512/3095/3095108.png" alt="">
                    <div class="guide-text">
                        <span class="guide-title">Seasonal Guide</span>

                    <div class="guide-text">

                        <span class="guide-subtitle">Pro farming methods</span>

                </button>

        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Guide Title</span>
                <button class="close-button" onclick="closeGuide()">×</button>
            </div>
            <div class="modal-body">
                <img id="guideImage" class="guide-image" src="" alt="Guide">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
