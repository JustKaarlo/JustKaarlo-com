<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Downloading...</title>
<style>
  body {
    margin: 0;
    background: #1e1e1e;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .loader {
    text-align: center;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top: 5px solid #00bcd4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Preparing your download...</p>
  </div>
  <script>
    // Get file ID from query param
    const params = new URLSearchParams(window.location.search);
    const fileId = params.get("id");

    if (fileId) {
      // Redirect after short delay so user sees the loader
      setTimeout(() => {
        window.location.href = `http://app.justkaarlo.com/download/${fileId}`;
      }, 1500);
    } else {
      document.querySelector(".loader p").textContent = "No file ID provided.";
    }
  </script>
</body>
</html>
