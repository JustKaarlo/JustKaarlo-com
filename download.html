<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Downloading...</title>
<link rel="icon" type="image/x-icon" href="./res/ico/favicon/favicon-1.ico">
<style>
  body {
    margin: 0;
    background: #1e1e1e;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .loader {
    text-align: center;
    max-width: 400px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top: 5px solid #00bcd4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  .fallback {
    display: none;
    margin-top: 25px;
    padding: 18px;
    background: #2a2a2a;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }
  .fallback p {
    font-size: 15px;
    margin-bottom: 12px;
    color: #ccc;
  }
  .fallback button {
    background: #00bcd4;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .fallback button:hover {
    background: #0097a7;
  }

  .done {
    display: none;
  }
  .done h2 {
    color: #00e676;
    margin-bottom: 10px;
  }
  .done p {
    color: #ccc;
  }
</style>
</head>
<body>
  <div class="loader" id="loaderBox">
    <div class="spinner" id="spinner"></div>
    <p id="statusText">Preparing your download…</p>

    <div class="fallback" id="fallbackBox">
      <p>This is taking longer than usual.<br>
         Do you want to try the default Google Drive link instead?</p>
      <button id="fallbackBtn">Open Google Drive Link</button>
    </div>
  </div>

  <div class="done" id="doneBox">
    <h2>✅ Download Started!</h2>
    <p>You will be redirected back in <span id="countdown">5</span> seconds…</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileId = params.get("id");
    const driveLink = `https://drive.google.com/file/d/${fileId}/view?usp=sharing`;
    const mainSite = "https://justkaarlo.com/mods"; // change if needed

    if (fileId) {
      // Try starting the download
      setTimeout(() => {
        // Create hidden iframe to trigger the download
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = `http://app.justkaarlo.com/download/${fileId}`;
        document.body.appendChild(iframe);

        // Switch UI to "done"
        document.getElementById("loaderBox").style.display = "none";
        document.getElementById("doneBox").style.display = "block";

        // Start countdown
        let timeLeft = 5;
        const countdownEl = document.getElementById("countdown");
        const interval = setInterval(() => {
          timeLeft--;
          countdownEl.textContent = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(interval);
            window.location.href = mainSite;
          }
        }, 1000);
      }, 1500);

      // Fallback option after 30s
      setTimeout(() => {
        if (document.getElementById("loaderBox").style.display !== "none") {
          document.getElementById("fallbackBox").style.display = "block";
          document.getElementById("fallbackBtn").onclick = () => {
            window.location.href = driveLink;
          };
        }
      }, 30000);
    } else {
      document.getElementById("statusText").textContent = "No file ID provided.";
    }
  </script>
</body>
</html>
