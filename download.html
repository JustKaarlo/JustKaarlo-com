<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Downloading...</title>
<style>
  body {
    margin: 0;
    background: #1e1e1e;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .loader {
    text-align: center;
    max-width: 400px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top: 5px solid #00bcd4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  .fallback {
    display: none;
    margin-top: 25px;
    padding: 18px;
    background: #2a2a2a;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }
  .fallback p {
    font-size: 15px;
    margin-bottom: 12px;
    color: #ccc;
  }
  .fallback button {
    background: #00bcd4;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .fallback button:hover {
    background: #0097a7;
  }
</style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Preparing your download…</p>

    <div class="fallback" id="fallbackBox">
      <p>This is taking longer than usual.<br>
         Do you want to try the default Google Drive link instead?</p>
      <button id="fallbackBtn">Open Google Drive Link</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileId = params.get("id");
    const driveLink = `https://drive.google.com/file/d/${fileId}/view?usp=sharing`;

    if (fileId) {
      // Redirect to backend after short delay
      setTimeout(() => {
        window.location.href = `http://app.justkaarlo.com/download/${fileId}`;
      }, 1500);

      // Show fallback option after 30s
      setTimeout(() => {
        document.getElementById("fallbackBox").style.display = "block";
        document.getElementById("fallbackBtn").onclick = () => {
          window.location.href = driveLink;
        };
      }, 30000);
    } else {
      document.querySelector(".loader p").textContent = "No file ID provided.";
    }
  </script>
</body>
</html>
