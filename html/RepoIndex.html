<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta property="og:title" content="JustKaarlo's - Repository Index">
    <meta property="og:description" content="A automatic index system of this repository.">
    <meta property="og:url" content="www.justkaarlo.com/html/RepoIndex.html">
    <meta property="og:image" content="res\JustKaarloCard.pngg">
    <meta property="og:type" content="website">
    
    <title>Pages</title>
    <link rel="icon" type="image/x-icon" href="res\ico\favicon\favicon-1.ico">
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/Indexer.css">
</head>

<body>
    <div class="main-frame">
        <h1>
            <img src="res\src\github-white-icon.webp" alt="Pages" style="height: 32px; vertical-align: middle; margin-right: 12px; margin-bottom: 4px;"/>Pages</h1>
        
        <!-- Repository Controls -->
        <div id="repo-controls">
            <div class="controls-group">
                <input id="owner" placeholder="Owner"/>
                <input id="repo" placeholder="Repository"/>
                <input id="branch" placeholder="Branch"/>
                <button id="loadBtn">Load Repository</button>
            </div>
            <div id="status">Ready to load repository</div>
        </div>

        <ul id="fileList"></ul>
    </div>

    <script src="js/githubIndexer.js"></script>
</body>
</html>
