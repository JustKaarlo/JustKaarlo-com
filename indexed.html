<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Repo Index</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --fg:#111; --muted:#666; --bg:#fff; --link:#0b69ff; }
    body { font: 14px/1.5 system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:var(--fg); background:var(--bg); margin:0; }
    header { padding:16px 20px; border-bottom:1px solid #eee; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; }
    header .meta { color:var(--muted); }
    #controls { display:flex; gap:8px; flex-wrap:wrap; }
    input { padding:6px 8px; border:1px solid #ddd; border-radius:8px; min-width:180px; }
    button { padding:6px 10px; border:1px solid #ddd; background:#f7f7f7; border-radius:8px; cursor:pointer; }
    main { padding:16px 20px; }
    ul.tree { list-style:none; padding-left:18px; }
    .folder > summary { cursor:pointer; }
    .name { margin-left:6px; }
    .muted { color:var(--muted); }
    .links a { margin-left:8px; text-decoration:none; color:var(--link); }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #ddd; border-top-color:#888; border-radius:50%; animation:spin 0.9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    details[open] > summary .caret::before { content:"▼"; }
    .caret::before { content:"▶"; display:inline-block; width:1em; }
    .file .caret::before { content:"•"; color:#bbb; }
    footer { padding:14px 20px; border-top:1px solid #eee; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>Repository Index</h1>
    <div id="repoMeta" class="meta"></div>
    <div id="controls">
      <input id="owner" placeholder="owner" />
      <input id="repo" placeholder="repo" />
      <input id="branch" placeholder="branch or tag" />
      <button id="loadBtn">Load</button>
    </div>
  </header>
  <main>
    <div id="status" class="muted">Idle</div>
    <div id="treeContainer"></div>
  </main>
  <footer>
    Public repos only without a token. GitHub API rate limit applies. For private repos, add a token and set the <code>AUTH_TOKEN</code> constant.
  </footer>

<script>
  // ===== CONFIG =====
  const OWNER  = "justkaarlo";   // e.g. "torvalds"
  const REPO   = "justkaarlo.github.io";    // e.g. "linux"
  const BRANCH = "Home";         // e.g. "main"
  const AUTH_TOKEN = "";         // optionally "ghp_…". Leave empty for public repos.

  // ===== UI wiring =====
  const ownerEl  = document.getElementById("owner");
  const repoEl   = document.getElementById("repo");
  const branchEl = document.getElementById("branch");
  const loadBtn  = document.getElementById("loadBtn");
  const statusEl = document.getElementById("status");
  const treeEl   = document.getElementById("treeContainer");
  const repoMeta = document.getElementById("repoMeta");

  ownerEl.value = OWNER; repoEl.value = REPO; branchEl.value = BRANCH;

  loadBtn.addEventListener("click", () => {
    loadIndex(ownerEl.value.trim(), repoEl.value.trim(), branchEl.value.trim());
  });

  // Auto-load on first paint
  window.addEventListener("DOMContentLoaded", () => {
    if (OWNER && REPO && BRANCH) loadIndex(OWNER, REPO, BRANCH);
  });

  // ===== Core logic =====
  async function loadIndex(owner, repo, branch) {
    if (!owner || !repo || !branch) {
      setStatus("Set owner, repo, and branch.");
      return;
    }
    setStatus(`Fetching tree for ${owner}/${repo}@${branch} <span class="spinner"></span>`);
    treeEl.innerHTML = "";
    repoMeta.textContent = `${owner}/${repo} · ${branch}`;

    try {
      const headers = { "Accept": "application/vnd.github+json" };
      if (AUTH_TOKEN) headers.Authorization = `Bearer ${AUTH_TOKEN}`;

      // 1) Resolve branch to commit SHA to avoid large tree failures
      const refUrl = `https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${encodeURIComponent(branch)}`;
      const refRes = await fetch(refUrl, { headers });
      if (!refRes.ok) throw await apiError(refRes, "Failed to resolve branch");
      const refData = await refRes.json();
      const commitSha = refData.object?.sha || refData.sha || null;
      if (!commitSha) throw new Error("Could not resolve branch to commit SHA.");

      // 2) Fetch full recursive tree
      const treeUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/${commitSha}?recursive=1`;
      const treeRes = await fetch(treeUrl, { headers });
      if (!treeRes.ok) throw await apiError(treeRes, "Failed to fetch tree");
      const treeData = await treeRes.json();
      const nodes = treeData.tree || [];

      // 3) Build a nested structure
      const root = { name: "/", type: "tree", children: new Map() };
      for (const item of nodes) {
        const parts = item.path.split("/");
        insertNode(root, parts, item.type);
      }

      // 4) Render
      const ul = document.createElement("ul");
      ul.className = "tree";
      renderNode(root, ul, { owner, repo, branch });
      treeEl.appendChild(ul);

      setStatus(`Indexed ${nodes.length} items.`);
    } catch (err) {
      setStatus(`Error: ${err.message}`);
    }
  }

  function insertNode(node, parts, type) {
    if (parts.length === 0) return;
    const [head, ...rest] = parts;
    if (!node.children.has(head)) {
      node.children.set(head, { name: head, type: rest.length ? "tree" : type, children: new Map() });
    }
    const child = node.children.get(head);
    if (rest.length) insertNode(child, rest, type);
  }

  function renderNode(node, parentEl, ctx, basePath = "") {
    // Skip the artificial root
    for (const [name, child] of [...node.children].sort(sortEntries)) {
      const path = basePath ? `${basePath}/${name}` : name;

      if (child.type === "tree") {
        const details = document.createElement("details");
        details.className = "folder";
        const summary = document.createElement("summary");
        const caret = document.createElement("span"); caret.className = "caret";
        const label = document.createElement("span"); label.className = "name"; label.textContent = name;
        summary.append(caret, label);
        details.appendChild(summary);

        const ul = document.createElement("ul"); ul.className = "tree";
        renderNode(child, ul, ctx, path);
        details.appendChild(ul);

        const li = document.createElement("li");
        li.appendChild(details);
        parentEl.appendChild(li);
      } else {
        const li = document.createElement("li"); li.className = "file";
        const caret = document.createElement("span"); caret.className = "caret";
        const nameSpan = document.createElement("span"); nameSpan.className = "name"; nameSpan.textContent = name;

        const links = document.createElement("span"); links.className = "links";
        const gh = document.createElement("a");
        gh.href = `https://github.com/${ctx.owner}/${ctx.repo}/blob/${encodeURIComponent(ctx.branch)}/${encodeURIComponent(path)}`;
        gh.target = "_blank"; gh.rel = "noopener"; gh.textContent = "view";

        const raw = document.createElement("a");
        raw.href = `https://raw.githubusercontent.com/${ctx.owner}/${ctx.repo}/${encodeURIComponent(ctx.branch)}/${encodeURIComponent(path)}`;
        raw.target = "_blank"; raw.rel = "noopener"; raw.textContent = "raw";

        links.append(gh, raw);
        li.append(caret, nameSpan, links);
        parentEl.appendChild(li);
      }
    }
  }

  function sortEntries([aName, a], [bName, b]) {
    if (a.type !== b.type) return a.type === "tree" ? -1 : 1;
    return aName.localeCompare(bName);
  }

  async function apiError(res, prefix) {
    let msg = `${prefix}. HTTP ${res.status}`;
    try {
      const j = await res.json();
      if (j.message) msg += ` · ${j.message}`;
    } catch {}
    return new Error(msg);
  }

  function setStatus(html) { statusEl.innerHTML = html; }
</script>
</body>
</html>
