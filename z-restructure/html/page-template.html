<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ════════════════════════════════════════════════════════
         ★  PAGE CONFIGURATION  —  ONLY EDIT THIS BLOCK  ★
         ════════════════════════════════════════════════════════ -->
    <script>
        const PAGE = {
            // id:             'fs25',                                              // → must match a key in DocRegistry (doc-data.js)
            // title:          'FARMING SIMULATOR 25',                              // → shown in <title>, navbar, hero
            // subtitle:       'GUIDES & TUTORIALS',                                // → shown in hero under title
            // logoSrc:        'https://www.justkaarlo.com/res/src/fs-logo.png',    // → hero logo image
            // bgImage:        '',                                                  // → optional background image (right side, blurred)
            // accentColor:    '#c8fb4b',                                           // → accent / highlight colour (hex)
            // navBackHref:    '../guides',                                         // → href for the "Back" nav link
            // navBackLabel:   'All Guides',                                        // → label for the "Back" nav link
            // particleColors: ['#ffaa00', '#ff6a00'],                              // → floating particle colours

            id: 'menu',
            title: 'TITLE',
            subtitle: 'SUBTITLE',
            logoSrc: 'https://cdn.discordapp.com/attachments/1272710972301381644/1480200016588050583/Coffee_Guy_Transparentv2.png?ex=69aecf30&is=69ad7db0&hm=0ae61775e70be4d9a1e78d5c569f8ed929d2801de9196564c1be8801ef179493&',
            bgImage: '',
            accentColor: '#0069cc',
            navBackHref: '../guides',
            navBackLabel: 'All Guides',
            particleColors: ['#0069cc', '#b100cc'],
        };
    </script>
    <!-- ════════════════════════════════════════════════════════ -->

    <title>JustKaarlo's</title>
    <link rel="icon" type="image/x-icon" href="https://www.justkaarlo.com/res/ico/favicon/docs.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@600;700;800&family=DM+Mono:wght@300;400;500&family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/docIndex.css">

    <meta property="og:type" content="website">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
</head>

<body>

    <!-- Background layers -->
    <div id="page-bg"></div>
    <div id="particles-js"></div>

    <!-- NavSystem compat shim (keeps doc-system.js happy) -->
    <div class="nav-container"><a id="nav-back-btn" href="#"></a></div>

    <div id="page-shell">

        <!-- ══════════════════════════════════════════════════
             TWO-TIER NAVBAR
             Row 1: brand (left)  ·  article count (right)
             Row 2: nav links     ·  search (right)
        ══════════════════════════════════════════════════ -->
        <header id="top-bar">

            <!-- Row 1 — brand + counter -->
            <div class="tb-row">
                <a class="nb-brand" href="https://www.justkaarlo.com/home">
                    <span class="nb-brand-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            viewBox="0 0 24 24" fill="var(--accent)"
                            stroke="#080909" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                            <path d="M14 3v5h5M16 13H8M16 17H8M10 9H8"/>
                        </svg>
                    </span>
                    <span class="nb-brand-wordmark">JustKaarlo's</span>
                </a>

                <div class="nb-counter">
                    <span class="nb-counter-dot"></span>
                    <span class="nb-counter-num" id="sb-count-text">0</span>
                    <span class="nb-counter-label">articles</span>
                </div>
            </div>

            <!-- Row 2 — nav links + search -->
            <div class="tb-row tb-nav">
                <nav class="nb-links">
                    <a href="https://www.justkaarlo.com/home" class="nb-link">
                        <span class="nb-slash">/</span> Home
                    </a>
                    <a id="sb-back-btn" href="#" class="nb-link active">
                        <span class="nb-slash">/</span>
                        <span id="sb-back-label">All Guides</span>
                    </a>
                </nav>

                <div class="nb-right">
                    <div class="nb-search">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input id="search-input" type="text" placeholder="Search articles...">
                    </div>
                </div>
            </div>

        </header><!-- /#top-bar -->


        <!-- ══ HERO (centered) ══ -->
        <div class="page-center">
            <header id="hero">
                <div class="hero-eyebrow">
                    <span class="hero-eyebrow-line"></span>
                    <span class="hero-eyebrow-text">JustKaarlo.com · Documentation</span>
                    <span class="hero-eyebrow-line"></span>
                </div>
                <img id="page-logo" class="hero-logo" src="" alt="">
                <h1 class="hero-title" id="sb-game-name">—</h1>
                <p  class="hero-subtitle" id="sb-game-sub">—</p>
            </header>
        </div>


        <!-- ══ CONTENT ══ -->
        <main id="content-area">
            <div class="page-center">
                <div id="doc-grid"></div>
                <div id="empty-state">// NO ARTICLES FOUND</div>
            </div>
        </main>


        <!-- ══ FOOTER ══ -->
        <footer id="page-footer">
            <div class="footer-inner">
                <span class="footer-text">© JustKaarlo.com — All rights reserved.</span>
                <span class="footer-text" id="topbar-title">Docs</span>
            </div>
            <p class="footer-disclaimer">Not affiliated with or endorsed by any game studio or publisher.</p>
        </footer>

    </div><!-- /#page-shell -->


    <!-- ══════════════════════════════════════════════════════════
         MODAL — all IDs kept exactly for doc-system.js compat
    ══════════════════════════════════════════════════════════════ -->
    <div id="docModal" class="doc-modal">
        <div class="doc-modal-content">
            <div class="doc-modal-header">
                <span class="doc-modal-title" id="docModalTitle">Article</span>
                <div class="doc-modal-header-actions">
                    <button id="docTocButton" class="doc-toc-button" style="display:none" onclick="toggleTOC()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h18v2H3v-2z"/>
                        </svg>
                    </button>
                    <a id="docArticleLink" href="#" target="_blank" class="doc-external-link" title="Open source">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </a>
                    <button class="doc-close-button" onclick="closeArticle()">×</button>
                </div>
            </div>

            <div id="docTocPanel" class="toc-panel">
                <div class="toc-header">
                    <span class="toc-title">Contents</span>
                    <button class="toc-close" onclick="toggleTOC()">×</button>
                </div>
                <div id="docTocContent" class="toc-content"></div>
            </div>

            <div class="doc-modal-body">
                <img id="docArticleImage" class="doc-article-image" src="" alt="Article" style="display:none">
                <div id="docArticleBody" class="doc-article-body"></div>
            </div>
        </div>
    </div>


    <!-- ══ SCRIPTS ══ -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="../js/docData.js"></script>
    <script src="../js/docSystem.js"></script>

    <script>
        // ── Apply PAGE config ──────────────────────────────────
        document.title = `JustKaarlo's · ${PAGE.title}`;
        document.querySelector('meta[property="og:title"]').content      = `JustKaarlo's — ${PAGE.title}`;
        document.querySelector('meta[property="og:description"]').content = PAGE.subtitle;

        // Accent colour
        if (PAGE.accentColor) {
            document.documentElement.style.setProperty('--accent', PAGE.accentColor);
            const h = PAGE.accentColor.replace('#','');
            const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
            document.documentElement.style.setProperty('--accent-alpha', `rgba(${r},${g},${b},.12)`);
        }

        // Background image
        if (PAGE.bgImage) {
            const bg = document.getElementById('page-bg');
            bg.style.backgroundImage = `url('${PAGE.bgImage}')`;
            bg.classList.add('has-image');
        }

        // Populate elements
        const logo = document.getElementById('page-logo');
        logo.src = PAGE.logoSrc;
        logo.alt = PAGE.title;

        document.getElementById('sb-game-name').textContent  = PAGE.title;
        document.getElementById('sb-game-sub').textContent   = PAGE.subtitle;
        document.getElementById('sb-back-btn').href          = PAGE.navBackHref;
        document.getElementById('sb-back-label').textContent = PAGE.navBackLabel || 'All Guides';
        document.getElementById('nav-back-btn').href         = PAGE.navBackHref;
        document.getElementById('topbar-title').textContent  = PAGE.title;

        // Close article (called from modal HTML onclick)
        function closeArticle() {
            DocSystem.closeModal();
            history.replaceState(null, '', window.location.href.split('#')[0]);
        }

        // Particles
        if (typeof particlesJS !== 'undefined') {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 22 },
                    color:  { value: PAGE.particleColors || ['#fff'] },
                    shape:  { type: 'circle' },
                    opacity: { value: 0.5, random: true },
                    size:   { value: 2, random: true },
                    line_linked: { enable: false },
                    move: { enable: true, speed: 0.17, direction: 'top', out_mode: 'out' }
                },
                interactivity: { events: { onhover: { enable: false }, onclick: { enable: false } } },
                retina_detect: true
            });
        }

        // ── Boot DocSystem ─────────────────────────────────────
        initDocPage('doc-grid', DocRegistry.get(PAGE.id));

        // Update article counter after grid renders
        requestAnimationFrame(() => {
            const n  = document.querySelectorAll('#doc-grid .doc-card').length;
            const el = document.getElementById('sb-count-text');
            if (el) el.textContent = n;
        });

        // ── Search ─────────────────────────────────────────────
        document.getElementById('search-input').addEventListener('input', function () {
            const q = this.value.trim().toLowerCase();
            const cards = document.querySelectorAll('#doc-grid .doc-card');
            let visible = 0;
            cards.forEach(card => {
                const hit = !q || card.textContent.toLowerCase().includes(q);
                card.classList.toggle('hidden', !hit);
                if (hit) visible++;
            });
            const empty = document.getElementById('empty-state');
            if (empty) empty.style.display = visible === 0 ? 'block' : 'none';
        });

        // ── Tabs — delegated init ──────────────────────────────
        // Auto-initialises any .doc-tabs widget inside article bodies.
        // Runs on every modal open by hooking into click delegation.
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.doc-tab-btn');
            if (!btn) return;
            const tabs = btn.closest('.doc-tabs');
            if (!tabs) return;

            const target = btn.dataset.tab;

            // Deactivate all buttons & panels
            tabs.querySelectorAll('.doc-tab-btn').forEach(b => b.classList.remove('active'));
            tabs.querySelectorAll('.doc-tab-panel').forEach(p => p.classList.remove('active'));

            // Activate selected
            btn.classList.add('active');
            const panel = tabs.querySelector(`.doc-tab-panel[data-tab="${target}"]`);
            if (panel) panel.classList.add('active');
        });

        // ── Code copy buttons (generic .doc-code-block) ───────
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.doc-code-copy');
            if (!btn) return;
            const pre = btn.closest('.doc-code-block')?.querySelector('pre');
            if (!pre) return;
            const text = pre.textContent;
            navigator.clipboard.writeText(text).then(() => {
                btn.classList.add('copied');
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy'; }, 2000);
            });
        });
    </script>
</body>
</html>
