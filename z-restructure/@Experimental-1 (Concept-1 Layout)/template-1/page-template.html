<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
    id:               'menu',                   → must match a key in DocRegistry
    title:            'Title',                  → shown in <title> and OG tags
    subtitle:         'Subtitles',              → shown in OG description
    logoSrc:          'url',                    → hero logo image
    bgClass:          'bg-def',                 → background div class
    particleColors:   ['#xxxxx', '#xxxxx'],     → particle colour array
    navBackHref:      '../example',             → where the "Go Back" nav button points 
    -->
    <script>
    const PAGE = {
        id: 'menu',
        title: 'Title',
        subtitle: 'Subtitles',
        logoSrc: 'https://cdn.discordapp.com/attachments/1272710972301381644/1480200016588050583/Coffee_Guy_Transparentv2.png?ex=69aecf30&is=69ad7db0&hm=0ae61775e70be4d9a1e78d5c569f8ed929d2801de9196564c1be8801ef179493&',
        bgClass: 'bg-def',
        particleColors: ['#464646', '#3D3D3D', '#7E7E7E', '#AAAAAA', '#C1C1C1', '#3D3D3D'],
        navBackHref: '../guides',
    };
    </script>
    <!-- ════════════════════════════════════════════════════════ -->

    <title>JustKaarlo's · <script>document.write(PAGE.title)</script></title>
    <link rel="icon" type="image/x-icon" href="https://www.justkaarlo.com/res/ico/favicon/guides.ico">
    <link rel="stylesheet" href="doc-style.css">

    <meta property="og:type"        content="website">
    <meta property="og:title"       content="JustKaarlo's — ">  <!-- filled by JS below -->
    <meta property="og:description" content="">                 <!-- filled by JS below -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Mono:wght@300;400&family=Rubik&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Dynamic background — class comes from PAGE.bgClass -->
    <div id="page-bg"></div>
    <div id="particles-js"></div>

    <!-- ── Navigation ── -->
    <div class="nav-container">
        <header class="nav-frame glass" style="width:170px">
            <nav class="nav-buttons">
                <a href="../home" class="nav-btn" aria-label="Home">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="1 0 20 20" fill="currentColor">
                        <path d="M12 3l8 8h-3v8h-10v-8h-3l8-8z"/>
                    </svg>
                    <div class="nav-tooltip">Go Home</div>
                </a>
                <a id="nav-back-btn" href="#" class="nav-btn" aria-label="Back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 512 512" fill="currentColor">
                        <path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"/>
                    </svg>
                    <div class="nav-tooltip">Go Back</div>
                </a>
            </nav>
        </header>
    </div>

    <!-- ── Main content ── -->
    <div class="content">
        <img id="page-logo" class="game-icon" src="" alt="Logo">

        <div class="doc-grid-container">
            <div class="doc-grid" id="doc-grid">
                <!-- Cards injected here by DocSystem.renderArticleGrid() -->
            </div>
        </div>
    </div>

    <!-- ── Article Modal ── -->
    <div id="docModal" class="doc-modal">
        <div class="doc-modal-content">
            <div class="doc-modal-header">
                <span class="doc-modal-title" id="docModalTitle">Article</span>
                <div class="doc-modal-header-actions">
                    <button id="docTocButton" class="doc-toc-button" style="display:none" onclick="toggleTOC()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h18v2H3v-2z"/>
                        </svg>
                    </button>
                    <a id="docArticleLink" href="#" target="_blank" class="doc-external-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M7 17L17 7M17 7H7M17 7V17" stroke="rgba(160,160,160,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                    <button class="doc-close-button" onclick="closeArticle()">×</button>
                </div>
            </div>

            <!-- TOC side panel -->
            <div id="docTocPanel" class="toc-panel">
                <div class="toc-header">
                    <span class="toc-title">Table of Contents</span>
                    <button class="toc-close" onclick="toggleTOC()">×</button>
                </div>
                <div id="docTocContent" class="toc-content"></div>
            </div>

            <div class="doc-modal-body">
                <img id="docArticleImage" class="doc-article-image" src="" alt="Article">
                <div id="docArticleBody" class="doc-article-body"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="doc-data.js"></script>
    <script src="doc-system.js"></script>

    <script>
    // ── Apply PAGE config ──────────────────────────────────────────
    document.querySelector('meta[property="og:title"]').content  = `JustKaarlo's — ${PAGE.title}`;
    document.querySelector('meta[property="og:description"]').content = PAGE.subtitle;
    document.getElementById('page-bg').className = PAGE.bgClass;
    document.getElementById('page-logo').src     = PAGE.logoSrc;
    document.getElementById('page-logo').alt     = PAGE.title;
    document.getElementById('nav-back-btn').href = PAGE.navBackHref;

    // ── Modal close (clears URL hash) ────────────────────────────
    function closeArticle() {
        DocSystem.closeModal();
        history.replaceState(null, '', window.location.href.split('#')[0]);
    }

    // ── Particles ────────────────────────────────────────────────
    particlesJS('particles-js', {
        particles: {
            number: { value: 40, density: { enable: true, value_area: 700 } },
            color:  { value: PAGE.particleColors },
            shape:  { type: 'circle' },
            opacity: { value: 0.4, random: true, anim: { enable: true, speed: 0.3, opacity_min: 0.2, sync: false } },
            size:    { value: 4, random: true, anim: { enable: true, speed: 4, size_min: 1, sync: false } },
            line_linked: { enable: false },
            move:    { enable: true, speed: 0.15, direction: 'top', random: true, straight: false, out_mode: 'out', bounce: false }
        },
        interactivity: { detect_on: 'canvas', events: { onhover: { enable: false }, onclick: { enable: false }, resize: true } },
        retina_detect: true
    });

    // ── Boot the article grid ────────────────────────────────────
    initDocPage('doc-grid', DocRegistry.get(PAGE.id));
    </script>
</body>
</html>
