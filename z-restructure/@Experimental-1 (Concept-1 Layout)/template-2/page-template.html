<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ════════════════════════════════════════════════════════
         ★  PAGE CONFIGURATION  —  ONLY EDIT THIS BLOCK  ★
         ════════════════════════════════════════════════════════ -->
    <script>
        const PAGE = {
            // id:             'fs25',                                          // → must match a key in DocRegistry (doc-data.js)
            // title:          'Farming Simulator 25',                          // → shown in <title>, sidebar, topbar
            // subtitle:       'Guides & Tutorials',                            // → shown in sidebar under title
            // logoSrc:        'https://www.justkaarlo.com/res/src/fs-logo.png',// → hero logo shown in sidebar
            // bgImage:        '',                                              // → optional background image URL (blurred, dimmed)
            // accentColor:    '#c8fb4b',                                       // → accent / highlight colour (hex)
            // navBackHref:    '../guides',                                     // → href for the "Back" button
            // navBackLabel:   'All Guides',                                    // → label for the "Back" button
            // particleColors: ['#ffaa00', '#ff6a00', '#8a8a8a'],               // → kept for compatibility
            id: 'menu',
            title: 'Title',
            subtitle: 'Subtitles',
            logoSrc: 'https://cdn.discordapp.com/attachments/1272710972301381644/1480200016588050583/Coffee_Guy_Transparentv2.png?ex=69aecf30&is=69ad7db0&hm=0ae61775e70be4d9a1e78d5c569f8ed929d2801de9196564c1be8801ef179493&',
            bgImage: '',
            accentColor: '#0069cc',
            navBackHref: '../guides',
            navBackLabel: 'All Guides',
            particleColors: ['#0069cc', '#b100cc'],
        };
    </script>
    <!-- ════════════════════════════════════════════════════════ -->

    <title>JustKaarlo's</title>
    <link rel="icon" type="image/x-icon" href="https://www.justkaarlo.com/res/ico/favicon/docs.ico">

    <link rel="stylesheet" href="../doc-style.css">
    <link rel="stylesheet" href="index.css">

    <meta property="og:type" content="website">
    <meta property="og:title" content="">
    <meta property="og:description" content="">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@300;400;500&family=Rubik:wght@300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="page-bg"></div>
    <div id="particles-js"></div>
    <div class="nav-container"><a id="nav-back-btn" href="#"></a></div>

    <div id="shell">

        <!-- SIDEBAR -->
        <aside id="sidebar">
            <a class="sb-brand" href="https://www.justkaarlo.com/home">
                <span class="sb-brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="#0069cc"
                        stroke="#090a0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                        <path d="M14 3v5h5M16 13H8M16 17H8M10 9H8" />
                    </svg>
                </span>
                <span class="sb-brand-wordmark">JustKaarlo's</span>
                <span class="sb-brand-badge">TAG</span>
            </a>

            <div class="sb-identity">
                <img id="page-logo" class="sb-logo" src="" alt="Logo">
                <div class="sb-game-name" id="sb-game-name">—</div>
                <div class="sb-game-sub" id="sb-game-sub">—</div>
                <div class="sb-count">
                    <span class="sb-count-dot"></span>
                    <span id="sb-count-text">0 articles</span>
                </div>
            </div>

            <nav class="sb-nav">
                <a href="https://www.justkaarlo.com/home" class="sb-nav-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                    Home
                </a>
                <a id="sb-back-btn" href="#" class="sb-nav-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                    <span id="sb-back-label">All Guides</span>
                </a>
            </nav>

            <div class="sb-footer">
                <span class="sb-footer-text">Justkaarlo.com</span>
            </div>
        </aside>

        <!-- MAIN -->
        <div id="main">
            <div id="topbar">
                <span class="topbar-title" id="topbar-title">Articles</span>
            </div>

            <div id="content-scroll">
                <div id="doc-grid"></div>
                <div id="empty-state">No articles found.</div>
            </div>
        </div>

    </div>

    <!-- MODAL — all IDs kept exactly for doc-system.js compatibility -->
    <div id="docModal" class="doc-modal">
        <div class="doc-modal-content">
            <div class="doc-modal-header">
                <span class="doc-modal-title" id="docModalTitle">Article</span>
                <div class="doc-modal-header-actions">
                    <button id="docTocButton" class="doc-toc-button" style="display:none" onclick="toggleTOC()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h18v2H3v-2z" />
                        </svg>
                    </button>
                    <a id="docArticleLink" href="#" target="_blank" class="doc-external-link" title="Open source">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                            <polyline points="15 3 21 3 21 9" />
                            <line x1="10" y1="14" x2="21" y2="3" />
                        </svg>
                    </a>
                    <button class="doc-close-button" onclick="closeArticle()">×</button>
                </div>
            </div>

            <div id="docTocPanel" class="toc-panel">
                <div class="toc-header">
                    <span class="toc-title">Contents</span>
                    <button class="toc-close" onclick="toggleTOC()">×</button>
                </div>
                <div id="docTocContent" class="toc-content"></div>
            </div>

            <div class="doc-modal-body">
                <img id="docArticleImage" class="doc-article-image" src="" alt="Article" style="display:none">
                <div id="docArticleBody" class="doc-article-body"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="doc-data.js"></script>
    <script src="doc-system.js"></script>

    <script>
        // Apply PAGE config
        document.title = `JustKaarlo's · ${PAGE.title}`;
        document.querySelector('meta[property="og:title"]').content = `JustKaarlo's — ${PAGE.title}`;
        document.querySelector('meta[property="og:description"]').content = PAGE.subtitle;

        if (PAGE.accentColor) {
            document.documentElement.style.setProperty('--accent', PAGE.accentColor);
            const h = PAGE.accentColor.replace('#', '');
            const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
            document.documentElement.style.setProperty('--accent-alpha', `rgba(${r},${g},${b},.10)`);
        }

        if (PAGE.bgImage) {
            const bg = document.getElementById('page-bg');
            bg.style.backgroundImage = `url('${PAGE.bgImage}')`;
            bg.classList.add('has-image');
        }

        document.getElementById('page-logo').src = PAGE.logoSrc;
        document.getElementById('page-logo').alt = PAGE.title;
        document.getElementById('sb-game-name').textContent = PAGE.title;
        document.getElementById('sb-game-sub').textContent = PAGE.subtitle;
        document.getElementById('sb-back-btn').href = PAGE.navBackHref;
        document.getElementById('sb-back-label').textContent = PAGE.navBackLabel || 'All Guides';
        document.getElementById('nav-back-btn').href = PAGE.navBackHref;
        document.getElementById('topbar-title').textContent = PAGE.title;

        function closeArticle() {
            DocSystem.closeModal();
            history.replaceState(null, '', window.location.href.split('#')[0]);
        }

        if (typeof particlesJS !== 'undefined') {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 30 },
                    color: { value: PAGE.particleColors || ['#fff'] },
                    shape: { type: 'circle' },
                    opacity: { value: 0.9, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true },
                    move: { enable: true, speed: 0.2, direction: 'top', out_mode: 'out' }
                },
                interactivity: {
                    events: {
                        onhover: { enable: false },
                        onclick: { enable: false }
                    }
                },
                retina_detect: true
            });
        }

        initDocPage('doc-grid', DocRegistry.get(PAGE.id));

        requestAnimationFrame(() => {
            const n = document.querySelectorAll('#doc-grid .doc-card').length;
            const el = document.getElementById('sb-count-text');
            if (el) el.textContent = `${n} article${n !== 1 ? 's' : ''}`;
        });

        document.getElementById('search-input').addEventListener('input', function () {
            const q = this.value.trim().toLowerCase();
            const cards = document.querySelectorAll('#doc-grid .doc-card');
            let visible = 0;
            cards.forEach(card => {
                const hit = !q || card.textContent.toLowerCase().includes(q);
                card.classList.toggle('hidden', !hit);
                if (hit) visible++;
            });
            const empty = document.getElementById('empty-state');
            if (empty) empty.style.display = visible === 0 ? 'block' : 'none';
        });
    </script>
</body>

</html>
