
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustKaarlo's – Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0f11;
      --surface:   #141518;
      --border:    rgba(255,255,255,0.07);
      --text:      #d4d5d8;
      --muted:     #5a5c63;
      --accent:    #c8fb4b;
      --accent-dim:rgba(200,251,75,0.12);
    }

    body {
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      min-height: 120vh;           /* just so you can see the header in context */
    }

    /* ─── HEADER ─────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 52px;
      background: rgba(14,15,17,0.82);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }

    /* subtle scanline texture */
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.012) 2px,
        rgba(255,255,255,0.012) 4px
      );
      pointer-events: none;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      height: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 0;
    }

    /* ─── WORDMARK ────────────────────────────────────────── */
    .wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .doc-icon {
      flex-shrink: 0;
      color: var(--accent);
      opacity: 0.85;
      position: relative;
      top: -1px;
    }

    .wordmark-name {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
      white-space: nowrap;
      line-height: 1;
    }

    .wordmark-sep {
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
    }

    .wordmark-page {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--accent);
      text-transform: uppercase;
      padding: 2px 7px;
      background: var(--accent-dim);
      border: 1px solid rgba(200,251,75,0.2);
      border-radius: 3px;
    }

    /* ─── DIVIDER ─────────────────────────────────────────── */
    .vdiv {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 20px;
      flex-shrink: 0;
    }

    /* ─── NAV ─────────────────────────────────────────────── */
    nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    nav a {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--muted);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      position: relative;
    }

    nav a:hover {
      color: var(--text);
      background: rgba(255,255,255,0.05);
    }

    nav a.active {
      color: #fff;
    }

    nav a.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 10px;
      right: 10px;
      height: 1.5px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ─── SPACER ──────────────────────────────────────────── */
    .spacer { flex: 1; }

    /* ─── RIGHT CONTROLS ──────────────────────────────────── */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* search pill */
    .search-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-pill:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.13);
    }

    .search-pill svg { color: var(--muted); flex-shrink: 0; }

    .search-pill span {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .search-pill kbd {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 3px;
      padding: 1px 5px;
      margin-left: 6px;
    }

    /* icon button */
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.15s, background 0.15s, border-color 0.15s;
      text-decoration: none;
    }

    .icon-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.13);
    }

    /* version badge */
    .version {
      font-family: 'DM Mono', monospace;
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    /* ─── PAGE BODY PREVIEW ───────────────────────────────── */
    .page-body {
      max-width: 1280px;
      margin: 64px auto;
      padding: 0 24px;
    }

    .page-body h1 {
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .page-body p {
      font-size: 14px;
      color: var(--muted);
      max-width: 460px;
      line-height: 1.7;
    }

    /* ─── LOAD ANIMATION ──────────────────────────────────── */
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    header { animation: slideDown 0.35s cubic-bezier(0.22,1,0.36,1) both; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">

    <!-- Wordmark -->
    <a class="wordmark" href="#">

      <!-- Document icon -->
      <svg class="doc-icon" width="15" height="18" viewBox="0 0 15 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- body -->
        <path d="M1.5 2C1.5 1.17 2.17 0.5 3 0.5H9L13.5 5V16C13.5 16.83 12.83 17.5 12 17.5H3C2.17 17.5 1.5 16.83 1.5 16V2Z"
              fill="rgba(200,251,75,0.08)" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
        <!-- folded corner -->
        <path d="M9 0.5V4.5H13.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- lines -->
        <line x1="4" y1="8"  x2="11" y2="8"  stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
        <line x1="4" y1="11" x2="11" y2="11" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
        <line x1="4" y1="14" x2="8"  y2="14" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      </svg>

      <span class="wordmark-name">JustKaarlo's</span>
      <span class="wordmark-sep">/</span>
      <span class="wordmark-page">Docs</span>
    </a>

    <div class="vdiv"></div>

    <!-- Nav -->
    <nav>
      <a href="#" class="active">Overview</a>
      <a href="#">Guides</a>
      <a href="#">API</a>
      <a href="#">Changelog</a>
    </nav>

    <div class="spacer"></div>

    <!-- Right actions -->
    <div class="header-actions">

      <span class="version">v2.4.1</span>

      <!-- Search -->
      <div class="search-pill">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Search docs</span>
        <kbd>⌘K</kbd>
      </div>

      <!-- GitHub -->
      <a class="icon-btn" href="#" title="GitHub">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.484 2 12.021c0 4.428 2.865 8.185 6.839 9.504.5.092.682-.217.682-.483 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.071 1.531 1.031 1.531 1.031.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.254-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.026 2.747-1.026.546 1.378.202 2.396.1 2.65.64.7 1.028 1.595 1.028 2.688 0 3.848-2.338 4.695-4.566 4.944.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.481C19.138 20.203 22 16.447 22 12.021 22 6.484 17.523 2 12 2z"/>
        </svg>
      </a>

    </div>
  </div>
</header>

<!-- Page preview -->
<div class="page-body">
  <h1>Getting started</h1>
  <p>Welcome to the documentation. Select a section above or use ⌘K to search across all pages.</p>
</div>

</body>
</html>
