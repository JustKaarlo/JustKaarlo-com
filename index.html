<!DOCTYPE html>
<html lang="en">

<head>
    <title>JustKaarlo's</title>
    <link rel="icon" type="image/x-icon" href="res/core/favicons/justkaarlo.ico">

    <link rel="stylesheet" href="css/home.css">

    <meta property="og:type" content="website">
    <meta property="og:title" content="JustKaarlo's /">
    <meta property="og:description" content="Personal website for guides, resources, projects, handy-notes etc...">
    <meta property="og:image" content="res/core/images/embed.png">
    <meta property="og:url" content="https://www.justkaarlo.com">
</head>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" as="image" href="res/core/images/waves-blur.png">
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <canvas id="particle-canvas"></canvas>
    <div class="bg" aria-hidden="true"></div>
    <header class="nav-frame glass">
        <nav class="nav-buttons">
            <a class="nav-btn" id="SelectedNavBtn" aria-label="Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="1 0 20 20" >
                    <image height="21" width="21" href="res/core/favicons/home.ico" />
                </svg>
            </a>
            <br>
            <a href="../mods" target="_self" class="nav-btn white" aria-label="Mods">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="1 0 20 20">
                    <image height="20" width="20" href="res/core/favicons/mods.ico" />
                </svg>
                <div class="nav-tooltip">Mods</div>
            </a>
            <a href="../guides" target="_self" class="nav-btn white" aria-label="Guides">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="1 0 20 20">
                    <image height="20" width="20" href="res/core/favicons/guides.ico" />
                </svg>
                <div class="nav-tooltip">Guides</div>
            </a>
        </nav>
    </header>
    <div class="workshop-frame glass" style="top: 80px;">
        <div class="workshop-content">
            <div class="steam-avatar">
                <img src="res/core/assets/steam/steam-avatar.png"
                    alt="Steam Avatar" class="steam-avatar-image">
                <div class="steam-avatar-border"></div>
            </div>
            <div class="workshop-text">
                <span class="workshop-title" style="color: #e5e5e5ee; font-weight: 700; text-decoration-skip-ink: all;">@JustKaarlo</span>
                <span class="workshop-subtitle">Steam</span>
            </div>
            <div class="workshop-actions">
                <a href="https://steamcommunity.com/id/justkaarlo/"
                target="_self" class="workshop-btn has-tooltip" style="left: 120px !important;">
                    <img src="res/core/assets/profile.svg" alt="Workshop" class="btn-icon">
                    <div class="card-tooltip">Profile</div>
                </a>

                <a href="https://steamcommunity.com/id/justkaarlo/myworkshopfiles/"
                target="_self" class="workshop-btn profile-btn has-tooltip" style="left: 120px !important;">
                    <img src="res/core/assets/steam.svg" alt="Profile" class="btn-icon">
                    <div class="card-tooltip">Workshop</div>
                </a>
            </div>
        </div>
    </div>

    <!-- GitHub Commit Frame -->
    <div class="github-frame glass" id="github-frame">
        <div class="github-content">
            <div class="github-header-section">
                <div class="github-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.868-.013-1.703-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.545 2.914 1.209.092-.937.349-1.546.636-1.903-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z" fill="currentColor"/>
                    </svg>
                </div>
                <div class="github-info">
                    <div class="github-title" id="github-commit-message">Loading commit...</div>
                    <div class="github-timestamp" id="github-timestamp">Fetching data...</div>
                </div>
            </div>
            <button class="github-btn" id="github-open-modal">View Changes</button>
        </div>
    </div>

    <!-- GitHub Modal -->
    <div class="github-modal" id="github-modal">
        <div class="github-modal-content">
            <div class="github-modal-header">
                <h2>Changed Files</h2>
                <button class="github-modal-close" id="github-close-modal">✕</button>
            </div>
            <div class="github-modal-body">
                <div id="github-file-tree" class="github-file-tree">
                    <div class="github-loading">Loading file changes...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="maintenance-frame glass">
        <div class="maintenance-content">
            <div class="maintenance-animation">
                <div class="maintenance-ring"></div>
                <div class="maintenance-ring delay"></div>
                <img src="res/core/assets/wrench.svg" alt="Maintenance">
            </div>

            <div class="maintenance-text">
                <span class="maintenance-title">Under Maintenance</span>
                <span class="maintenance-subtitle">
                    We are currently rolling out new features and improvements, Website will not be fully functional under maintenance...
                </span>
            </div>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2026 JustKaarlo. All rights reserved.</p>
    </footer>
    <script src="js/home.js"></script>
</body>
</html>
