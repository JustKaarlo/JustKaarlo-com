<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustKaarlo - Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <!-- Background Canvas and Image -->
    <div class="bg"></div>
    <canvas id="particle-canvas"></canvas>

    <!-- Navigation Bar (Static - Not from settings.js) -->
    <nav class="nav-frame glass">
        <div class="nav-buttons">
            <a href="./" class="nav-btn" title="Home">
                <img src="../res/ico/home.svg" alt="Home" class="nav-icon">
                <div class="nav-tooltip">Home</div>
            </a>
            <a href="#" class="nav-btn" title="Settings">
                <img src="../res/ico/settings.svg" alt="Settings" class="nav-icon">
                <div class="nav-tooltip">Settings</div>
            </a>
            <a href="#" class="nav-btn" title="Library">
                <img src="../res/ico/library.svg" alt="Library" class="nav-icon">
                <div class="nav-tooltip">Library</div>
            </a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="main-wrapper">
        <div class="container">
            <!-- Logo Section -->
            <!-- <div class="logo-section glass">
                <div class="logo-card"></div>
            </div> -->

            <!-- Navigation Buttons -->
            <div class="button-section">
                <div class="button-row" id="main-nav-buttons">
                    <!-- Generated by settings.js -->
                </div>
            </div>

            <!-- Recently Updated Section -->
            <div class="recently-updated-section">
                <h3 class="recently-updated-title">Latest</h3>
                <div class="recently-updated-container" id="recently-updated-buttons">
                    <!-- Generated by settings.js -->
                </div>
            </div>
        </div>
    </div>

    <!-- Workshop/Profile Frame -->
    <div class="workshop-frame glass">
        <div class="workshop-content">
            <!-- Generated by settings.js -->
        </div>
    </div>

    <!-- Changelog Modal -->
    <div id="changelog-modal" class="changelog-modal glass">
        <div class="changelog-modal-content">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 JustKaarlo. All rights reserved.</p>
    </footer>

    <!-- Load Settings First -->
    <script src="settings.js"></script>
    
    <!-- Then Load Home Script -->
    <script src="home.js"></script>
</body>
</html>
