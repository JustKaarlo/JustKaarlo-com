name: Jekyll with GitHub Pages

on:
  push:
    branches: ["Home"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secrets
        run: | 
          find ./ -type f -path "./*" -exec sed -i "s|__API_KEY__|${{ secrets.GOOGLE_DRIVE_API }}|g" {} +
          find ./ -type f -path "./js/*" -exec sed -i "s|__API_KEY__|${{ secrets.GOOGLE_DRIVE_API }}|g" {} +
          find ./ -type f -path "./report/js/*" -exec sed -i "s|__WEBHOOK_URL__|${{ secrets.WEBHOOK_URL }}|g" {} +
          find ./ -type f -path "./report/*" -exec sed -i "s|__WEBHOOK_URL__|${{ secrets.WEBHOOK_URL }}|g" {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
