<head>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" as="image"
        href="https://justkaarlo.github.io/JustKaarlo-Google-Site/resources/MainBackground_1_5120x1440.png">
    <link rel="preload" as="image"
        href="https://justkaarlo.github.io/JustKaarlo-Google-Site/resources/Header_2_Image.png">
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
  <canvas id="particle-canvas"></canvas>
  <div class="bg" aria-hidden="true"></div>
  <div class="nav-container">
    <header class="nav-frame glass">
        <nav class="nav-buttons">
        <a href="https://sites.google.com/view/justkaarlos" target="_blank" class="nav-btn" aria-label="Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="27" height="20" viewBox="1 0 20 20" fill="currentColor">
                <path d="M12 3l8 8h-3v8h-10v-8h-3l8-8z"/>
            </svg>
        </a>
        <a href="https://sites.google.com/view/justkaarlos/mods" target="_blank" class="nav-btn">Mods</a>
        <a class="nav-btn" id="SelectedNavBtn">Reports</a>
        </nav>
    </header>

  <header class="nav-frame glass">
      <nav class="nav-buttons">
          <a href="javascript:void(0)" class="nav-btn" onclick="openModal('https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Arrest-Report.html')">Arrest</a>
          <a href="javascript:void(0)" class="nav-btn" onclick="openModal('https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Citation-Report.html')">Citation</a>
          <a href="javascript:void(0)" class="nav-btn" onclick="openModal('https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Coroner-Report.html')">Coroner</a>
          <a href="javascript:void(0)" class="nav-btn" onclick="openModal('https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Medical-Report.html')">Medical</a>
          <a href="javascript:void(0)" class="nav-btn" onclick="openModal('https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Fire-Incident-Report.html')">Fire Incident</a>
          <a href="javascript:void(0)" class="nav-btn" onclick="openModal('https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Towing-Report.html')">Tow</a>
          <a href="javascript:void(0)" class="nav-btn" onclick="openModal('https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Prison-Transport.html')">Prison Transport</a>
      </nav>
      <div class="nav-share">
      <button id="shareBtn" class="share-btn">
        <svg class="share-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="5" r="2" fill="#fff"></circle>
          <circle cx="6" cy="19" r="2" fill="#fff"></circle>
          <circle cx="18" cy="19" r="2" fill="#fff"></circle>
          <line x1="12" y1="7" x2="6" y2="17" stroke="#fff" stroke-width="2"></line>
          <line x1="12" y1="7" x2="18" y2="17" stroke="#fff" stroke-width="2"></line>
        </svg>
      </button>
      <div id="sharePopup" class="share-popup">
        <select id="shareSelect">
          <option value="https://sites.google.com/view/justkaarlos/Reports/arrest-report">Arrest-Report</option>
          <option value="https://sites.google.com/view/justkaarlos/Reports/citation-report">Citation-Report</option>
          <option value="https://sites.google.com/view/justkaarlos/Reports/coroner-report">Coroner-Report</option>
          <option value="https://sites.google.com/view/justkaarlos/Reports/medical-report">Medical-Report</option>
          <option value="https://sites.google.com/view/justkaarlos/Reports/fire-incident-report">Fire-Incident-Report</option>
          <option value="https://sites.google.com/view/justkaarlos/Reports/tow-report">Towing-Report</option>
          <option value="https://sites.google.com/view/justkaarlos/Reports/Prison-Transport-Report">Prison Transport Report</option>
        </select>
        <button id="copyLinkBtn">Copy Link</button>
      </div>
    </header>
  </div>
  <main class="container">
    <div class="logo-card" style="margin: 150px auto 0 auto; text-align: center;">
      <img src="https://justkaarlo.github.io/JustKaarlo-Google-Site/resources/Header_2_Image.png"
           alt="Logo Card Image" />
    </div>
  </main>
  <div class="overlay" id="overlay" onclick="closeModal()"></div>
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeModal()">X</button>
    <div class="iframe-wrapper">
      <iframe id="modal-frame"></iframe>
    </div>
  </div>

    <script>
        const logoCard = document.querySelector('.logo-card');

        logoCard.addEventListener('mousemove', (e) => {
            const rect = logoCard.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = -(y - centerY) / 150;
            const rotateY = (x - centerX) / 150;

            logoCard.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(0.98)`;
        });

        logoCard.addEventListener('mouseleave', () => {
            logoCard.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) scale(1)';
        });

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.vx = (Math.random() - 0.5) * 0.13;
                this.vy = (Math.random() - 0.5) * 0.13;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.init();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(120,120,120,0.3)';
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 25; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        resize();
        initParticles();
        animateParticles();

        const modal = document.getElementById('modal');
        const iframe = document.getElementById('modal-frame');
        const overlay = document.getElementById('overlay');
        function openModal(src) {
            overlay.style.display = 'block';
            modal.style.display = 'block';
            iframe.onload = () => {
                const maxH = window.innerHeight * 0.99;
                let h;
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    h = Math.min(doc.documentElement.scrollHeight, maxH);
                    doc.documentElement.style.scrollbarWidth = 'none';
                    doc.documentElement.style.msOverflowStyle = 'none';
                    doc.body.style.scrollbarWidth = 'none';
                    doc.body.style.msOverflowStyle = 'none';
                    const styleTag = doc.createElement('style');
                    styleTag.textContent = `html::-webkit-scrollbar, body::-webkit-scrollbar {width:0; height:0; background: transparent;}`;
                    doc.head.appendChild(styleTag);
                } catch {
                    h = maxH;
                }
                modal.style.height = h + 'px';
            };
            iframe.src = src;
        }

        function closeModal() {
            modal.style.display = 'none';
            overlay.style.display = 'none';
            iframe.src = '';
            modal.style.height = '';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const hashMap = {
                '#arrest-report': 'https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Arrest-Report.html',
                '#citation-report': 'https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Citation-Report.html',
                '#coroner-report': 'https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Coroner-Report.html',
                '#medical-report': 'https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Medical-Report.html',
                '#fire-incident': 'https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Fire-Incident-Report.html',
                '#tow-report': 'https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Towing-Report.html',
                '#prison-transport': 'https://justkaarlo.github.io/JustKaarlo-Google-Site/html/Reports/Prison-Transport.html'
            };

            const url = hashMap[window.location.hash];
            if (url) {
                openModal(url);
            }
        });

        const shareBtn = document.getElementById('shareBtn');
        const sharePopup = document.getElementById('sharePopup');
        const shareSelect = document.getElementById('shareSelect');
        const copyLinkBtn = document.getElementById('copyLinkBtn');

        shareBtn.addEventListener('click', e => {
            e.stopPropagation();
            if (sharePopup.style.display === 'block') {
                sharePopup.style.display = 'none';
                sharePopup.classList.remove('open');
            } else {
                sharePopup.style.display = 'block';
                sharePopup.classList.add('open');
            }
        });

        copyLinkBtn.addEventListener('click', () => {
            const link = shareSelect.value;
            const tmp = document.createElement('textarea');
            tmp.value = link;
            document.body.appendChild(tmp);
            tmp.select();
            document.execCommand('copy');
            document.body.removeChild(tmp);

            copyLinkBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyLinkBtn.textContent = 'Copy Link';
                sharePopup.style.display = 'none';
            }, 2000);
        });

        document.addEventListener('click', e => {
            if (!sharePopup.contains(e.target) && e.target !== shareBtn) {
                sharePopup.style.display = 'none';
                sharePopup.classList.remove('open');
            }
        });
    </script>
</body>

</html>
