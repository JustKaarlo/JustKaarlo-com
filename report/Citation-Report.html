<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Citation Report</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-title">DEPARTMENT OF JUSTICE</div>
      <div class="header-subtitle">CITATION REPORT</div>
    </div>
    <div class="row">
      <div class="field-group wide">
        <label>Location</label>
        <textarea id="location" class="autogrow" rows="1" required></textarea>
      </div>
      <div class="field-group"><label>Time & Date</label><input type="datetime-local" id="datetime" required></div>
    </div>
    <div class="row">
      <div class="field-group"><label>Name</label><input type="text" id="name" required></div>
      <div class="field-group"><label>Amount</label><input type="text" id="amount" placeholder="$" required></div>
    </div>
    <div class="section-title">VIOLATION(S)</div>
    <div class="row">
      <div class="field-group wide">
        <div id="violation-tags" class="tag-container">
          <input type="text" id="violationInput" placeholder="Type And Press Enter">
        </div>
      </div>
    </div>
    <div class="button-row">
      <button class="clear-btn" onclick="resetForm()">Clear</button>
      <button class="submit-btn" onclick="submitForm()">Submit</button>
    </div>
    <div id="popup-overlay">
      <div class="header-title">Report Submitted</div>
      <div class="header-subtitle">Your Report Has Been Logged</div>
    </div>
    <div id="error-popup">
      <div class="header-title">Submission Failed</div>
      <div class="header-subtitle">All Fields Are Required</div>
    </div>
  </div>
  <script>
    // Configuration for Citation Report
    window.ReportConfig = {
      WEBHOOK_URL: "__WEBHOOK_URL__",
      THREAD_ID: "1396776491890507796",
      REPORT_TYPE: "CITATION REPORT",
      REPORT_FOOTER: "Department of Justice",
      REPORT_COLOR: 4737096
    };
  </script>
  <script src="js/script.js"></script>
</body>
</html>
