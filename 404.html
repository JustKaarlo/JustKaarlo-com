<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="css/grid-overlay.css">

  <meta property="og:type" content="website">
  <meta property="og:title" content="JustKaarlo's / 404 ERROR">

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a1a 0%, #292929 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #f0f0f0;
    }

    html,
    body {
        height: 100%;
        width: 100%;
        overflow: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    body {
        position: relative;
        font-family: 'Rubik', sans-serif;
        color: #eee;
        min-height: 100vh;
        overflow-x: hidden;
        overflow: scroll;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
        display: none;
    }

  #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-position: center;
      background-repeat: repeat;
      background-size: 30%;
      background-attachment: fixed;
      z-index: 0;
      pointer-events: none;
      filter: grayscale(100%);
      background-image:
          linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
          url('res/core/style/fakebricks-large.webp');
  }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .error-container {
      border-radius: 20px;
      padding: 3rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(0.7px);
      font-family: "Geist Mono", monospace;
      font-weight: 600;
      color: #e6e7eb4f;
      background: linear-gradient(rgba(22,22,22,0.2), rgba(14,14,14,0.4));
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: all 300ms ease;
    }

    .error-code {
      font-size: 5rem;
      font-weight: bold;
      color: #ff4c4c;
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #e6e7ebc0;
    }

    .btn {
        --bg-glass: rgba(255, 255, 255, 0.05);
        --border-glass: rgba(255, 255, 255, 0.12);
        --text: #e1e2e7;
        border-radius: 16px;
        padding: 12px 15px;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.4px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        cursor: pointer;
        font-family: "Geist Mono", monospace;
        background: linear-gradient(180deg, rgba(110, 110, 110, 0.2), rgba(151, 151, 151, 0.164));
        border: 1px solid rgba(0, 0, 0, 0.1);
        color: #e6e7eb;
        transition: all 150ms ease;
    }

    .btn:hover {
      background: linear-gradient(180deg, rgba(110, 110, 110, 0.4), rgba(151, 151, 151, 0.2));
      border: 1px solid rgba(36, 36, 36, 0.3);
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(95, 95, 95, 0.15);
    }

    .btn svg {
        display: block;
        margin: 0 auto;
    }
  </style>
</head>

  </div>

  <script>

      bgColor: '#1a1a1a',

  <script src="js/grid-overlay.js"></script>

</html>
